version: 2
updates:
  # For Gradle, update dependencies and plugins to the latest non-major version
  - package-ecosystem: "gradle"
    groups:
      dependencies:
        patterns:
          - "*"
    directory: "/scalardl-cleanup"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]

  # For GitHub Actions, update all actions on the default branch
  - package-ecosystem: "github-actions"
    groups:
      actions on branch master:
        patterns:
          - "*"
    directory: "/"
    schedule:
      interval: "weekly"

  # For Docker, update the base images pinned in the Dockerfiles on the default branch only
  # The support and release branches are not covered here because base image updates are applied to them
  # by backporting the changes merged into the default branch
  # When a new Dockerfile that pins its base image is added, add its directory to the "directories" list below
  # Major version updates of the JRE base image are ignored because upgrading the Java runtime
  # of the released images is a manual decision; the other base image updates are grouped into a single PR
  - package-ecosystem: "docker"
    groups:
      container images on branch master:
        patterns:
          - "*"
    directories:
      - "/scalardl-cleanup/cli"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]
    schedule:
      interval: "weekly"
