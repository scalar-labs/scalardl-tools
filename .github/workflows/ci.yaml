name: CI

on:
  push:
    branches: [master]
    paths:
      - 'scalardl-cleanup/**'
      - '!scalardl-cleanup/ci/e2e/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    paths:
      - 'scalardl-cleanup/**'
      - '!scalardl-cleanup/ci/e2e/**'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

# Serialize every run that touches the shared Cosmos account.
concurrency:
  group: cosmos

defaults:
  run:
    working-directory: scalardl-cleanup

jobs:
  check:
    name: Check (unit tests + spotless)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run check
        run: |
          ./gradlew \
            :common:check \
            :resumable-scan:check \
            :coordinator-state-cleanup:check \
            :ledger-finalize-records:check \
            :auditor-finalize-records:check \
            :request-proof-cleanup:check \
            :cli:check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            scalardl-cleanup/common/build/reports/tests/test/
            scalardl-cleanup/resumable-scan/build/reports/tests/test/
            scalardl-cleanup/coordinator-state-cleanup/build/reports/tests/test/
            scalardl-cleanup/ledger-finalize-records/build/reports/tests/test/
            scalardl-cleanup/auditor-finalize-records/build/reports/tests/test/
            scalardl-cleanup/request-proof-cleanup/build/reports/tests/test/
            scalardl-cleanup/cli/build/reports/tests/test/

  jdbc-integration-test:
    name: JDBC integration test (resumable-scan, PostgreSQL)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Start PostgreSQL
        run: |
          docker run -d --name db -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 60); do
            docker exec db psql -U postgres -c "SELECT 1;" > /dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs db
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run integration tests
        run: |
          ./gradlew :resumable-scan:jdbcIntegrationTest \
            -Dscalardb.jdbc.url=jdbc:postgresql://localhost:5432/postgres \
            -Dscalardb.jdbc.username=postgres \
            -Dscalardb.jdbc.password=postgres

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jdbc-integration-test-reports
          path: scalardl-cleanup/resumable-scan/build/reports/tests/jdbcIntegrationTest/

  integration-test:
    name: Cosmos DB integration test (resumable-scan)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run integration tests
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: |
          ./gradlew :resumable-scan:cosmosIntegrationTest \
            -Dscalardb.cosmos.uri="$COSMOS_URI" \
            -Dscalardb.cosmos.password="$COSMOS_KEY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: scalardl-cleanup/resumable-scan/build/reports/tests/cosmosIntegrationTest/

  ledger-finalize-integration-test:
    name: Cosmos DB integration test (ledger-finalize-records)
    needs: integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run integration tests
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: |
          ./gradlew :ledger-finalize-records:cosmosIntegrationTest \
            -Dscalardb.cosmos.uri="$COSMOS_URI" \
            -Dscalardb.cosmos.password="$COSMOS_KEY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledger-finalize-integration-test-reports
          path: scalardl-cleanup/ledger-finalize-records/build/reports/tests/cosmosIntegrationTest/

  ledger-finalize-multi-storage-integration-test:
    name: Multi-storage integration test (ledger-finalize-records, Cosmos DB and PostgreSQL)
    needs: ledger-finalize-integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start PostgreSQL
        run: |
          docker run -d --name db -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17-alpine
          for i in $(seq 1 60); do
            docker exec db psql -U postgres -c "SELECT 1;" > /dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs db
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run integration tests
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: |
          ./gradlew :ledger-finalize-records:multiStorageIntegrationTest \
            -Dscalardb.cosmos.uri="$COSMOS_URI" \
            -Dscalardb.cosmos.password="$COSMOS_KEY" \
            -Dscalardb.jdbc.url=jdbc:postgresql://localhost:5432/postgres \
            -Dscalardb.jdbc.username=postgres \
            -Dscalardb.jdbc.password=postgres

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledger-finalize-multi-storage-integration-test-reports
          path: scalardl-cleanup/ledger-finalize-records/build/reports/tests/multiStorageIntegrationTest/

  auditor-finalize-integration-test:
    name: Cosmos DB integration test (auditor-finalize-records)
    needs: ledger-finalize-multi-storage-integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run integration tests
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: |
          ./gradlew :auditor-finalize-records:cosmosIntegrationTest \
            -Dscalardb.cosmos.uri="$COSMOS_URI" \
            -Dscalardb.cosmos.password="$COSMOS_KEY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditor-finalize-integration-test-reports
          path: scalardl-cleanup/auditor-finalize-records/build/reports/tests/cosmosIntegrationTest/

  coordinator-cleanup-integration-test:
    name: Cosmos DB integration test (coordinator-state-cleanup)
    needs: auditor-finalize-integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run integration tests
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: |
          ./gradlew :coordinator-state-cleanup:cosmosIntegrationTest \
            -Dscalardb.cosmos.uri="$COSMOS_URI" \
            -Dscalardb.cosmos.password="$COSMOS_KEY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coordinator-cleanup-integration-test-reports
          path: scalardl-cleanup/coordinator-state-cleanup/build/reports/tests/cosmosIntegrationTest/

  request-proof-cleanup-integration-test:
    name: Cosmos DB integration test (request-proof-cleanup)
    needs: coordinator-cleanup-integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run integration tests
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: |
          ./gradlew :request-proof-cleanup:cosmosIntegrationTest \
            -Dscalardb.cosmos.uri="$COSMOS_URI" \
            -Dscalardb.cosmos.password="$COSMOS_KEY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: request-proof-cleanup-integration-test-reports
          path: scalardl-cleanup/request-proof-cleanup/build/reports/tests/cosmosIntegrationTest/
