name: E2E

# End-to-end test for ScalarDL Cleanup against a real Cosmos DB. Runs scenarios in ci/e2e/scenarios.
#
# CI-only. Requires repository secrets: COSMOS_URI, COSMOS_KEY, CR_PAT.

on:
  pull_request:
    paths:
      - 'scalardl-cleanup/**'
      - '.github/workflows/e2e.yaml'
  workflow_dispatch:
    inputs:
      old_version:
        description: 'OLD ScalarDL version that populates data'
        default: '3.13.0'
      new_version:
        description: 'NEW ScalarDL server version the tool coordinates with'
        default: '3.14.0-SNAPSHOT'

defaults:
  run:
    working-directory: scalardl-cleanup

# Serialize every run that touches the shared Cosmos account.
concurrency:
  group: cosmos

jobs:
  e2e:
    name: cleanup
    runs-on: ubuntu-latest
    env:
      SCALARDL_OLD_VERSION: ${{ github.event.inputs.old_version || '3.13.0' }}
      SCALARDL_NEW_VERSION: ${{ github.event.inputs.new_version || '3.14.0-SNAPSHOT' }}
      GHCR_USER: ${{ github.repository_owner }}
      # Records generated per category (committed / stranded write / stranded read).
      RECORD_COUNT: 5
      # Tag of the cleanup image built from this checkout and loaded into minikube. The manifests
      # resolve the image as ghcr.io/scalar-labs/scalardl-cleanup:${CLEANUP_VERSION}; any tag other
      # than "latest" keeps the default imagePullPolicy at IfNotPresent, so the locally loaded image
      # is used and nothing is pulled from ghcr.
      CLEANUP_VERSION: dev
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve the ScalarDB version
        # Read it from the build, so the fixture's node and SQL CLI cannot drift from the tool's.
        run: |
          set -euo pipefail
          v=$(./gradlew :cli:properties -q | awk '$1 == "scalarDbVersion:" { print $2 }')
          [ -n "$v" ] || { echo "::error::could not read scalarDbVersion from the build"; exit 1; }
          echo "Fixture ScalarDB version: $v"
          echo "SCALARDB_VERSION=$v" >> "$GITHUB_ENV"

      - name: Build the cleanup container image
        # The cleanup commands run from the manifests, which deploy the container image, so build it
        # here with the same :cli:docker task the release workflows use.
        # GPR_* let Gradle pull the ScalarDL artifacts from GitHub Packages.
        env:
          GPR_USERNAME: ${{ github.repository_owner }}
          GPR_PASSWORD: ${{ secrets.CR_PAT }}
        run: ./gradlew :cli:docker -PdockerVersion="$CLEANUP_VERSION"

      - name: Install Azure Cosmos DB Shell
        # Used by the scenarios to count rows directly in Cosmos for their reclamation checks.
        run: |
          set -euo pipefail
          v=1.1.4
          url="https://github.com/Azure/CosmosDBShell/releases/download/v${v}/cosmosdbshell_linux-x64_${v}-preview.zip"
          curl -sSfL -o "$RUNNER_TEMP/cosmosdbshell.zip" "$url"
          unzip -q "$RUNNER_TEMP/cosmosdbshell.zip" -d "$RUNNER_TEMP/cosmosdbshell"
          # The archive extracts to CosmosDBShell/CosmosDBShell (a self-contained binary next to its
          # runtime DLLs); -iname guards against the exact casing changing between releases.
          bin="$(find "$RUNNER_TEMP/cosmosdbshell" -type f -iname cosmosdbshell | head -n1)"
          [ -n "$bin" ] || { echo "::error::cosmosdbshell binary not found in the archive"; exit 1; }
          chmod +x "$bin"
          echo "COSMOSDB_SHELL=$bin" >> "$GITHUB_ENV"

      - name: Download ScalarDB Cluster SQL CLI
        # setup-fixture.sh leaves records non-terminal by preparing transactions it never commits.
        run: |
          set -euo pipefail
          v="$SCALARDB_VERSION"
          url="https://github.com/scalar-labs/scalardb/releases/download/v${v}/scalardb-cluster-sql-cli-${v}-all.jar"
          jar="$RUNNER_TEMP/scalardb-cluster-sql-cli.jar"
          curl -sSfL -o "$jar" "$url"
          echo "SCALARDB_SQL_CLI=$jar" >> "$GITHUB_ENV"

      - name: Download ScalarDL HashStore CLI
        # The garbage is created by the old-version client, so the CLI tracks SCALARDL_OLD_VERSION.
        run: |
          set -euo pipefail
          v="$SCALARDL_OLD_VERSION"
          url="https://github.com/scalar-labs/scalardl/releases/download/v${v}/scalardl-hashstore-java-client-sdk-${v}.zip"
          curl -sSfL -o "$RUNNER_TEMP/hashstore.zip" "$url"
          unzip -q "$RUNNER_TEMP/hashstore.zip" -d "$RUNNER_TEMP/hashstore"
          bin="$RUNNER_TEMP/hashstore/scalardl-hashstore-java-client-sdk-${v}/bin/scalardl-hashstore"
          chmod +x "$bin"
          echo "CLIENT=$bin" >> "$GITHUB_ENV"

      - name: Set up minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
        with:
          cpus: '4'
          memory: '8192'

      - name: Load the cleanup image into minikube
        # The image was built into the runner's Docker daemon, which the minikube node cannot see.
        run: minikube image load "ghcr.io/scalar-labs/scalardl-cleanup:$CLEANUP_VERSION"

      - name: Deploy ScalarDL (old version) + load schema
        id: deploy
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          CR_PAT: ${{ secrets.CR_PAT }}
          SCALARDL_VERSION: ${{ env.SCALARDL_OLD_VERSION }}
        run: ./ci/e2e/manage-cluster.sh deploy

      # Diagnostics are collected per step, not once at the end of the job: the scenarios below keep
      # running after an earlier one failed and each rebuilds the fixture, so a single dump would
      # only ever describe the last scenario. collect-diagnostics.sh has the details.
      #
      # `!cancelled() &&` is not redundant: an `if:` with no status check function is evaluated as
      # `success() && ...`, which is false precisely when the step to diagnose failed.
      - name: Collect diagnostics - deploy
        if: ${{ !cancelled() && steps.deploy.outcome == 'failure' }}
        run: ./ci/e2e/collect-diagnostics.sh 'deploy'

      - name: Run scenario - Auditor without RecoverAssetLock
        id: old_auditor
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          RECORD_COUNT: 1
        run: ./ci/e2e/scenarios/old-auditor.sh

      - name: Collect diagnostics - Auditor without RecoverAssetLock
        if: ${{ !cancelled() && steps.old_auditor.outcome == 'failure' }}
        run: ./ci/e2e/collect-diagnostics.sh 'scenario - Auditor without RecoverAssetLock'

      - name: Run scenario - happy path
        id: happy_path
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
        run: ./ci/e2e/scenarios/happy-path.sh

      - name: Collect diagnostics - happy path
        if: ${{ !cancelled() && steps.happy_path.outcome == 'failure' }}
        run: ./ci/e2e/collect-diagnostics.sh 'scenario - happy path'

      - name: Run scenario - interrupt and resume
        id: interrupt_resume
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          RECORD_COUNT: 20 # Enough rows that the scan is still running when the Pod is deleted.
        run: ./ci/e2e/scenarios/interrupt-resume.sh

      - name: Collect diagnostics - interrupt and resume
        if: ${{ !cancelled() && steps.interrupt_resume.outcome == 'failure' }}
        run: ./ci/e2e/collect-diagnostics.sh 'scenario - interrupt and resume'

      - name: Drop the fixture's ScalarDB records
        if: always()
        run: |
          set -euo pipefail
          source ./ci/e2e/db-records.sh
          if [ ! -f "${SCALARDB_SQL_CLI:-}" ] \
            || ! kubectl -n "$LEDGER_NS" get deployment scalardb-cluster >/dev/null 2>&1; then
            echo "No SQL CLI or no cluster node to drop them with; nothing to do."
            exit 0
          fi
          load_ad_credentials
          db_records_sql_init
          db_records_drop_schema

      - name: Drop Cosmos schema
        if: always()
        env:
          COSMOS_URI: ${{ secrets.COSMOS_URI }}
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          SCALARDL_VERSION: ${{ env.SCALARDL_OLD_VERSION }}
        # Fatal on purpose: the shared Cosmos account must be left clean, so a failed
        # drop fails the job to alert an operator (who then drops it manually).
        run: ./ci/e2e/manage-cluster.sh drop-schema

      - name: Tear down namespaces
        if: always()
        run: ./ci/e2e/manage-cluster.sh clean
