# When we push a new SNAPSHOT image, the old SNAPSHOT image remains as an untagged
# image in GitHub Packages. We remove those untagged images by using this workflow.

name: Remove untagged images

on:
  schedule:
    # UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  remove-untagged-container-images:
    runs-on: ubuntu-latest

    steps:
      - name: scalardl-cleanup
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: scalardl-cleanup
          package-type: container
          delete-only-untagged-versions: 'true'
          # Safe only while the image is single-arch: a multi-arch build leaves
          # its per-arch child images untagged in GHCR, so this cron would delete
          # them and break the tagged manifest list.
          min-versions-to-keep: 0
          token: ${{ secrets.CR_PAT }}
