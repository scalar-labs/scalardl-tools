# When we push a new SNAPSHOT image, the old SNAPSHOT image remains as an untagged
# image in GitHub Packages. We remove those untagged images by using this workflow.

name: Remove untagged images

on:
  schedule:
    # UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  remove-untagged-container-images:
    runs-on: ubuntu-latest

    steps:
      # Safe only while the image is single-arch: a multi-arch build leaves its
      # per-arch child images untagged in GHCR, so this cron would delete them
      # and break the tagged manifest list.
      - name: scalardl-cleanup
        uses: camargo/delete-untagged-action@v1
        with:
          github-token: ${{ secrets.CR_PAT }}
          package-name: scalardl-cleanup
