# ScalarDB configuration of the fixtures CLI when it writes the PostgreSQL table of the
# multi-storage scenarios. There the CLI plays a ScalarDB instance that shares the Coordinator
# table with the Ledger and keeps a table of its own in PostgreSQL: the Coordinator table resolves
# to the default storage, the Ledger's Cosmos DB account.
#
# Deliberately not derived from manifests/ledger-ad/configmap-multistorage.yaml, which is what the
# cleanup Jobs get. An operator writes the tool's configuration by reading the sharing instance's,
# not by copying it, so the two here are written separately too, down to the storage names. Were
# they one file, a mistake in it would be made on both the writing and the reading side and cancel
# out.
#
# db-records.sh substitutes the ${...} variables with envsubst. The JDBC URL points at a
# port-forward, because the CLI runs on the runner and not in the cluster.
scalar.db.storage=multi-storage
scalar.db.multi_storage.storages=ledger_cosmos,shared_pg
scalar.db.multi_storage.storages.ledger_cosmos.storage=cosmos
scalar.db.multi_storage.storages.ledger_cosmos.contact_points=${FIXTURE_COSMOS_URI}
scalar.db.multi_storage.storages.ledger_cosmos.password=${FIXTURE_COSMOS_KEY}
scalar.db.multi_storage.storages.shared_pg.storage=jdbc
scalar.db.multi_storage.storages.shared_pg.contact_points=jdbc:postgresql://localhost:${POSTGRES_LOCAL_PORT}/${POSTGRES_DB}
scalar.db.multi_storage.storages.shared_pg.username=${POSTGRES_USER}
scalar.db.multi_storage.storages.shared_pg.password=${POSTGRES_PASSWORD}
scalar.db.multi_storage.default_storage=ledger_cosmos
scalar.db.multi_storage.namespace_mapping=${POSTGRES_NAMESPACE}:shared_pg
