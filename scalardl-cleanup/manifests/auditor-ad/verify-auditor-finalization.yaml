# ScalarDL Cleanup — verify-auditor-finalization (Auditor administrative domain).
#
# Read-only: scans from the beginning on every run and keeps no checkpoint, so it needs no
# checkpoint volume.
#
# envsubst variables:
#   ${CLEANUP_VERSION}  scalardl-cleanup image tag

apiVersion: batch/v1
kind: Job
metadata:
  name: scalardl-verify-auditor-finalization
  labels:
    app.kubernetes.io/name: scalardl-cleanup
    app.kubernetes.io/component: command
    app.kubernetes.io/part-of: scalardl
spec:
  # restartPolicy: Never (below) + backoffLimit: 3 → retry up to 3 times, a new pod on each failure.
  backoffLimit: 3
  # Exit code 2 is the verdict "something still needs finalization", which a retry cannot change,
  # so fail the Job at once instead of scanning again. Any other failure is retried as above.
  # Requires Kubernetes 1.26 or later; older clusters ignore this field and retry.
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: verify-auditor-finalization
          operator: In
          values: [2]
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scalardl-cleanup
        app.kubernetes.io/component: command
        app.kubernetes.io/part-of: scalardl
    spec:
      restartPolicy: Never
      # The tool never calls the Kubernetes API, so don't mount the default ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        # The image runs as uid/gid 201 ("scalar").
        runAsUser: 201
        runAsGroup: 201
        runAsNonRoot: true
        fsGroup: 201
      containers:
        - name: verify-auditor-finalization
          image: ghcr.io/scalar-labs/scalardl-cleanup:${CLEANUP_VERSION}
          args:
            - verify-auditor-finalization
            - --properties=/etc/scalardl-cleanup/cleanup-auditor.properties
          envFrom:
            - secretRef:
                name: scalardl-cleanup-credentials
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            # The tool writes only to the /tmp emptyDir below, so the root filesystem can stay
            # read-only; the app tree is root-owned, unwritable by uid 201.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/scalardl-cleanup
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: scalardl-cleanup-auditor-config
        # Startup scratch for the JVM/Netty (java.io.tmpdir). Needed because readOnlyRootFilesystem
        # blocks writes to the container's own /tmp. Throwaway — deleted with the pod.
        - name: tmp
          emptyDir: {}
