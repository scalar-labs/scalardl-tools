# ScalarDL Cleanup — checkpoint volume for the Ledger administrative domain.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scalardl-cleanup-checkpoint
  labels:
    app.kubernetes.io/name: scalardl-cleanup
    app.kubernetes.io/component: checkpoint
    app.kubernetes.io/part-of: scalardl
    app.kubernetes.io/managed-by: kubectl
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
